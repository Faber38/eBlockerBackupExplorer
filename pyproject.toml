[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eblocker-backup-explorer"
version = "0.1.0"
description = "Lokaler, ausschließlich lesender Explorer für eBlocker-Appfreigaben"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Faber38"}]
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
eblocker-backup-explorer = "eblocker_backup_explorer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
